[project]
name = "ubiqx-api"
version = "0.1.0"
description = "Local-first FastAPI backend for Ubiqx AI Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic>=2.10,<3.0",
  "psd-tools>=1.10,<2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
